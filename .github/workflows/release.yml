# Build the B-SS Go example and publish a GitHub Release (the example's binaries + metrics.json)
# when a vX.Y.Z tag is pushed. PRs run the same build, smoke test and Wire Tests without
# publishing.
#
# Two stages: (1) build the CAS BACnet Stack shared library from the stack submodule into
# submodules/cas-bacnet-stack/bin/ (MSBuild ReleaseDll|x64 on Windows, g++ -shared on Linux -
# README "Build"), then (2) `go build` this project with cgo. The executable loads the library
# at run time (the stack's own adapter in DLL mode): it has no load-time dependency on it, and
# finds it next to itself or, in this checkout, in submodules/cas-bacnet-stack/bin/.
#
# THE STACK LIBRARY IS NEVER RELEASED. It is built here only to compile and test the example.
# A release ships the example's executable and docs; the "Package" step fails if any
# CASBACnetStack* / .dll / .so / .node file is in the package, and the next step runs the
# packaged executable without the library and checks that it prints the series'
# missing-library message and exits 1. Users build the library from the submodule themselves
# (README "Build").
#
# The CAS BACnet Stack is a PRIVATE git submodule: the repository secret CAS_STACK_PAT must
# hold a PAT with read access to chipkin/cas-bacnet-stack.
name: build-and-release

on:
  pull_request:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022 pins the VS 2022 (v143) toolset the stack's ReleaseDll config is built
          # with. cgo also needs a gcc (MinGW-w64), installed below.
          - os: windows-2022
            artifact: BACnetProfileExampleBSSGo-windows-x64
            exe: build/BACnetExampleBSS.exe
            metrics: metrics-windows.json
          - os: ubuntu-latest
            artifact: BACnetProfileExampleBSSGo-linux-x64
            exe: build/BACnetExampleBSS
            metrics: metrics-linux.json
    steps:
      - name: Enable git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout (with the CAS BACnet Stack submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CAS_STACK_PAT || github.token }}

      - name: Stack commit (recorded in metrics.json)
        id: stack
        shell: bash
        run: echo "sha=$(git -C submodules/cas-bacnet-stack rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up MinGW-w64 (Windows - the C compiler cgo needs, separate from MSVC)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Build the CAS BACnet Stack library (Windows - MSBuild ReleaseDll|x64, into the submodule's bin/)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          & $msbuild submodules\cas-bacnet-stack\projects\msvs\CASBACnetStack\CASBACnetStack.vcxproj `
            /p:Configuration=ReleaseDll /p:Platform=x64 /p:PlatformToolset=v143 /m
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }
          Get-ChildItem submodules\cas-bacnet-stack\bin\CASBACnetStack_x64_Release.dll

      - name: Build the CAS BACnet Stack library (Linux - g++ shared, into the submodule's bin/)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p submodules/cas-bacnet-stack/bin
          g++ -shared -fPIC -std=c++17 -O2 \
              -I submodules/cas-bacnet-stack/source \
              submodules/cas-bacnet-stack/source/*.cpp \
              -o submodules/cas-bacnet-stack/bin/libCASBACnetStack_x64_Release.so
          ls -la submodules/cas-bacnet-stack/bin/libCASBACnetStack_x64_Release.so

      - name: go vet + go build (CGO_ENABLED=1)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          go vet . ./cgobridge ./common
          go build -o "${{ matrix.exe }}" .

      - name: Smoke test + metrics (starts, binds, stays up; measures time to 'ready')
        shell: bash
        run: |
          start=$(date +%s%3N)
          ./"${{ matrix.exe }}" --port 47822 > smoke.log 2>&1 &
          PID=$!
          ready_ms=""
          for i in $(seq 1 100); do
            if grep -q "ready" smoke.log; then ready_ms=$(( $(date +%s%3N) - start )); break; fi
            sleep 0.1
          done
          sleep 2
          if kill -0 "$PID" 2>/dev/null; then kill "$PID" 2>/dev/null || true; else echo "FAIL: device exited early"; cat smoke.log; exit 1; fi
          [ -n "$ready_ms" ] || { echo "FAIL: no 'ready' line"; cat smoke.log; exit 1; }
          cat smoke.log
          bytes=$(stat -c %s "${{ matrix.exe }}" 2>/dev/null || wc -c < "${{ matrix.exe }}")
          sha=$(sha256sum "${{ matrix.exe }}" | cut -c1-16)
          stackver=$(grep -oE 'CAS BACnet Stack version: [0-9.]+' smoke.log | head -1 | grep -oE '[0-9.]+$' || true)
          appver=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' smoke.log | head -1 || true)
          cat > "${{ matrix.metrics }}" <<EOF
          {
            "example": "BACnetProfileExampleBSSGo",
            "app_version": "$appver",
            "os": "${{ matrix.os }}",
            "link_mode": "cgo-runtime-load (adapters/cpp DLL mode)",
            "stack_commit": "${{ steps.stack.outputs.sha }}",
            "stack_version": "$stackver",
            "binary_bytes": $bytes,
            "binary_sha256_prefix": "$sha",
            "startup_ms_to_ready": $ready_ms,
            "go_version": "$(go version)",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "git_ref": "${{ github.ref_name }}"
          }
          EOF
          cat "${{ matrix.metrics }}"
          { echo '### metrics (${{ matrix.os }})'; echo '```json'; cat "${{ matrix.metrics }}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The Wire Tests (tests/README.md): discovery, the readings following the Simulation, and
      # the Failure Modes, driven over BACnet/IP by Python peers. Python 3 standard library only.
      - name: Wire Tests
        if: runner.os == 'Linux'
        shell: bash
        run: python3 tests/run_wire_tests.py --exe "${{ matrix.exe }}"

      - name: Package (the example only - never the CAS BACnet Stack library)
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.exe }}" "${{ matrix.metrics }}" dist/
          # The docs ship once, from the Linux build: the Windows checkout converts them
          # to CRLF, so the two platforms' copies differ byte for byte and the release
          # job's one-copy-per-name check refuses them.
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp README.md TUTORIAL.md LICENSE dist/
            cp docs/PICS.md dist/
          fi
          if find dist \( -iname 'CASBACnetStack*' -o -iname 'libCASBACnetStack*' -o -iname '*.dll' -o -iname '*.so' -o -iname '*.so.*' -o -iname '*.dylib' -o -iname '*.node' \) | grep .; then
            echo "FAIL: a CAS BACnet Stack binary is in the package - it is never released"; exit 1
          fi
          ls -l dist

      # Rule 2b: the released executable, run where there is no stack library, must say so
      # clearly and exit 1 - never an OS loader error. It runs from an empty folder outside
      # this checkout, so the development fallback (submodules/cas-bacnet-stack/bin/) is not found.
      - name: Packaged executable without the stack library - clear message, exit 1
        shell: bash
        run: |
          nolib="$RUNNER_TEMP/nolib"
          exe="$(basename "${{ matrix.exe }}")"
          mkdir -p "$nolib"
          cp "dist/$exe" "$nolib/"
          set +e
          "$nolib/$exe" --port 47823 > "$nolib/out.txt" 2>&1
          code=$?
          set -e
          cat "$nolib/out.txt"
          first=$(head -n 1 "$nolib/out.txt" | tr -d '\r')
          [ "$first" = "ERROR: This example cannot run without the CAS BACnet Stack library." ] || { echo "FAIL: unexpected first line: $first"; exit 1; }
          [ "$code" -eq 1 ] || { echo "FAIL: exit code $code, expected 1"; exit 1; }
          echo "OK: missing-library message and exit code 1"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Every platform artifact carries the same docs (README.md, LICENSE, ...).
      # Uploading two assets with one name makes the release action fail part-way
      # and leaves a draft release behind (a real tagged release hit this). Flatten the
      # artifacts into one folder with a single copy of each file name, and stop
      # if two files share a name but differ.
      - name: Collect release assets (one copy of each file name)
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f | sort | while read -r f; do
            name=$(basename "$f")
            if [ -e "release/$name" ]; then
              cmp -s "$f" "release/$name" || { echo "FAIL: two different files are both named $name ($f)"; exit 1; }
            else
              cp "$f" "release/$name"
            fi
          done
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
